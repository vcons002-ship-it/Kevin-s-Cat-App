# Kevin's Cat App — example configuration.
#
# You normally DON'T edit this by hand: run the app and use the web GUI, which
# writes config.yaml for you. This file documents every setting and provides
# sensible defaults. `setup.sh` copies it to config.yaml on first run.

# --- Camera (legacy single active camera; used when active_cameras is empty) ---
camera_url: ""            # RTSP/HTTP stream, e.g. rtsp://192.168.1.50:554/stream1
camera_name: ""           # friendly name (filled in by auto-detect; display only)
camera_username: ""       # only if the stream needs a login
camera_password: ""

# --- Multi-camera: watch several at once, each with its own role & settings ---
# Manage these from the GUI's Cameras card. Each saved camera is a full config
# dict; `active_cameras` lists which to watch simultaneously. The detection
# settings below (model, person_confidence, roi, motion, ...) are the DEFAULTS a
# new camera inherits. `roll` = a person here rolls for a treat; `track_cats` =
# its cat sightings are logged. The treat dispenser (dice/dc/cooldown/speakers)
# is shared across all cameras.
active_cameras: []        # e.g. ["Kitchen", "Garage"]; empty = the single camera above
cameras: []               # e.g.:
#   - {name: Kitchen, url: "rtsp://1.2.3.4/main", username: admin, password: "secret",
#      roll: true,  track_cats: false, model: yolo11n, scan_fps: 10.0, roi: null}
#   - {name: Garage,  url: "usb:0", roll: false, track_cats: true, model: yolo26m}

# --- Speaker(s) (Google Home / Nest — where the chime plays) ---
speaker_names: []         # one or more exact names, e.g. ["Kitchen speaker", "Office"]
speaker_name: ""          # legacy single name (still honoured if speaker_names is empty)

# --- Sound / speech ---
sound_file: "treat_chime.wav"   # a file in d20app/sounds/ (upload your own in the GUI)
use_speech: false         # speak a message instead of playing the chime
speech_text: "Give the cat a treat!"   # what to say when use_speech is true

# --- Game rules ---
dice_sides: 20            # 20 = D20, 100 = D100, ...
dc: 20                    # treat when the roll is >= this (DC20 on a D20 = only a natural 20)
cooldown_seconds: 600     # minimum seconds between rolls (frequency interval)

# --- Detection tuning ---
detector_model: yolo11n   # benchmark-settled lineup (#70/#71): yolo11n (floor, 640 since #80, default), yolo26m (lightweight), yolo26x / *_fp16 (workhorse; export-only). Dropped models (yolo11m/... , #79) raise a loud, actionable error (no silent worse detector).
accelerator: auto         # auto (default, #71: CUDA when it genuinely binds, else CPU — logged loudly, never a silent slow fallback), cpu, opencl (iGPU via OpenCL), openvino-gpu / openvino-auto (Intel OpenVINO; optional 'openvino' pkg), onnx-cuda (NVIDIA; optional 'onnxruntime-gpu', raises if CUDA doesn't bind)
person_confidence: 0.5    # 0..1; raise to reduce false triggers, lower to catch harder poses
cat_confidence: 0.5       # 0..1; min confidence for a cat (locator) detection — independent of person_confidence and label_floor. Gates the track_cats/Show-cat path only.
locator_classes: ["cat"]  # COCO classes that count as "the cat" for the locator. A no-dog household can use ["cat", "dog"] (the model often mislabels a cat as a dog).
confirm_frames: 4         # require a person in this many frames in a row (cuts false positives, incl. a moving cat's brief high-confidence frame)
detect_size: 300          # legacy MobileNet-SSD input size — ignored since 0.25.0 (YOLO size is fixed by its export). Kept so old configs still load.
scan_fps: 10.0            # how often the DETECTOR looks, in frames/sec — not how often the app talks to the camera (it reads every frame regardless; see smooth_live_feed). Lower = less inference. Never set it ABOVE the camera's frame rate: there are no new frames to see, so the detector would re-examine ones it has already judged (the app warns if you do).
smooth_live_feed: false   # IGNORED since 0.59.0. A network camera is now always read continuously, because an RTSP stream is a QUEUE: reading it slower than it arrives means acting on ever-older frames (measured at 46s of lag per MINUTE), not on fewer frames. Every frame must be decoded to stay current, so showing them costs almost nothing extra. To cut CPU, lower the camera's own stream frame rate. Kept so old configs still load.
roi: null                 # [x, y, w, h] region of interest — set this visually in the GUI

# --- Locator resolution (the still-cat scan only; the fast treat path is untouched).
# A sleeping cat shrunk into a 640 frame can be too small to detect; tiling and/or a
# larger input give the locator scan more effective resolution. ---
cat_scan_tiling: "3x3"     # "off" | "2x2" | "3x3" | "4x4" — split into an overlapping grid, detect per tile, merge. Default 3x3 per the full benchmark (#70): best clean recall per ms; 4x4 adds ~1 cat at 1.7x the cost.
cat_scan_tile_overlap: 0.35 # fraction each tile overlaps its neighbour (benchmark #70: 3x3 is best at 0.35; 2x2 prefers 0.20)
cat_scan_imgsz: 0          # LEGACY, no effect since 0.40.0 (#79): >640 input measured worse than 640 (#70); tiling is the lever. Kept so old configs load.
cat_scan_frames: 3         # INERT since 0.59.0, removed from the GUI in 0.62.0. The averaging lives in the synchronous read branch and network cameras all read continuously now, so it never runs. Kept so old configs load.
track_fusion: true         # temporal fusion: a string of WEAK cat detections that chain smoothly and actually MOVE is confirmed as one sighting (source "track") — catches a walking cat no single frame can confirm; the movement requirement keeps decoys out. false = judge every frame alone.
motion_hold_seconds: 2.0   # after motion fires, keep running the detector for this long — refreshed by every further motion frame, so an active cat is watched continuously and this only sets how long a LULL is tolerated. Without it the net only sees frames that MOVED (the motion-blurred, mid-stride ones) and a cat pausing mid-walk runs no inference. Gates like motion, so the treat cooldown pause and round-robin still win. 0 = motion frames only.
motion_reference_ms: 200   # compare each frame against the newest one at least this old IN THE VIDEO (not whatever arrived last). RTSP frames queue, so reads land ~33ms apart in video time even at 5 scan_fps; the motion test is an area test, so slow/distant cats were missed. 0 = old behaviour.
swap_confirm_count: 0              # Follow mode: detections a NEW camera needs before it may take a feed (0/1 = swap on the first). Raise it if overlapping views make a cat near an edge steal the feed.
camera_reuse_cooldown_seconds: 0.0 # Follow mode: seconds a camera that just lost its feed is barred from taking one again — breaks a two-camera ping-pong.
fusion_debug: false        # troubleshooting only: write one structured record per fusion decision to fusion_events.jsonl (per-hit score/label/box, travel vs threshold, whether a strong box coexisted). Adds nothing to the activity feed.

# --- Round-robin (cap CPU when watching many cameras: run a few at a time, rotating
# sets — many cameras at the CPU of a few). Per-camera "always_watch" exempts a camera. ---
round_robin: false         # rotate detection across the watched cameras instead of all-at-once
round_robin_size: 2        # how many cameras detect at once (the rest rest, releasing their capture)
round_robin_interval: 15.0 # seconds each set is watched before rotating

# --- Image adjustments (applied BEFORE the net; tune in the GUI's "Test detection"
# tool against a real photo). All defaults are no-ops. ---
gamma: 1.0                # >1 brightens midtones / lifts shadows, <1 darkens; 1.0 = off
brightness: 0             # add to every pixel, -100..100; 0 = off
contrast: 1.0             # multiply around mid-grey, 0.5..2.0; 1.0 = off
saturation: 1.0           # colour intensity: 0 = greyscale, 1.0 = off, >1 = punchier

# --- Cat check (a still/sleeping cat makes no motion to trip the net) ---
cat_scan_interval: 30.0   # how often (sec) a cat-tracking camera runs the net even with NO motion, to catch a sleeping cat: >0 = every N seconds (30 default), 0 = always on (net every frame, most CPU), <0 = off (motion only). Measured from the last STILL-SCAN — before 0.62.0 any net run reset it, including motion, so a room with a person in it never scanned at all.
log_still_scan_sightings: true  # write a sighting every time the still scan finds a cat. ON is the point of the log: repeated rows are how you tell "she stayed in that room for two hours" from "she left unseen after thirty seconds". Turn it off only to run a short interval for testing without filling the log.
cat_scan_trigger: timer   # "timer" = every cat_scan_interval seconds, whatever else is happening. "quiet" = every interval, but skipped while a cat has already been detected on that camera within the same window (don't hunt for one you just found).

# --- Quiet time (no chimes during this daily window; leave blank to disable) ---
quiet_start: ""           # "HH:MM" 24h, e.g. "22:00"
quiet_end: ""             # "HH:MM" 24h, e.g. "07:00" (may wrap past midnight)

# --- Casting behaviour ---
dont_interrupt_playback: false   # if true, skip the chime when the speaker is already playing

# --- VLM (moondream) cat-presence tester ---
moondream_api_key: ''     # paste in the GUI instead — authenticates the one-time local weight download AND cloud inference. Never logged; never sent back to the browser. Env MOONDREAM_API_KEY also works.
vlm_escalation: false     # allow the "find the cat" escalation ladder (zoom crops -> YOLO -> VLM detect/query) to run against LIVE cameras on demand. The fast treat path never uses it; Test-tool escalation on uploads works regardless.

# --- Servers ---
web_port: 8080            # the GUI
file_server_port: 8081    # serves the sound file to the speaker
